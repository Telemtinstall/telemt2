; Global v3: пример ответов для тихой установки.
; Скопируйте в install.local.ini, заполните и выполните chmod 600 install.local.ini.
; Запуск: sudo bash install-global.sh --silent --config install.local.ini
; Проверка файла и пакета без установки: bash install-global.sh --check --config install.local.ini
; Комментарии пишите отдельной строкой. Значения не заключайте в кавычки.
; Пустые необязательные значения игнорируются. Неиспользуемые секции VPN не устанавливают протокол.

[protocols]
; Установить AmneziaWG 2.0: yes / no.
amnezia20 = no
; Установить AmneziaWG 3.1: yes / no.
amnezia31 = yes
; Один обязательный выбор: 1 = VLESS, 2 = Hysteria 2. Оба одновременно запрещены.
vless_or_hysteria2 = 2

[server]
; Публичный IPv4, назначенный интерфейсу сервера, или auto — определить автоматически.
public_ip = auto
; Имя первого VPN-пользователя: 1–32 символа, латиница, цифры, точка, _, -.
initial_client = vpnuser1
; Скорость канала в Мбит/с: положительное число или auto — измерить Speedtest.
; Если Speedtest недоступен или заблокирован — сообщить и установить 100 Мбит/с.
channel_mbit = auto

[telegram]
; Токен бота от BotFather. Обязательно заменить; секрет, не публиковать.
bot_token = REPLACE_BOT_TOKEN
; Числовые Telegram ID администраторов через запятую, без пробелов.
admin_ids = 123456789

[amnezia20]
; UDP-порт: 1–65535, должен быть свободен. Используется при [protocols] amnezia20 = yes.
port = 1234

[amnezia31]
; Секция используется при [protocols] amnezia31 = yes.
; UDP-порт: 1–65535, должен отличаться от других выбранных UDP-портов.
port = 1235

[vless]
; Секция используется при [protocols] vless_or_hysteria2 = 1.
; Внешний TCP-порт: 1–65535. TCP 443 и UDP 443 могут использоваться одновременно.
port = 443
; Режим: reality / direct / mask. Для direct TLS-маскировка не настраивается.
mode = reality
; Собственный домен: обязателен только при [vless] mode = mask, нужен доступный TCP 80.
domain =
; Адрес и порт сайта для Reality, используется только при [vless] mode = reality.
reality_target = www.google.com:443
; SNI для Reality, используется только при [vless] mode = reality.
reality_sni = www.google.com

[hysteria2]
; Секция используется при [protocols] vless_or_hysteria2 = 2.
; Внешний UDP-порт: 1–65535. Нельзя совпадать с выбранными портами AWG.
port = 443
; Собственный домен: все A-записи должны вести на public_ip. Для этой сборки без AAAA.
; Для получения и продления сертификата требуется доступный TCP 80.
domain = vpn.example.org
; Режим: none = HTTP/3 + сайт; salamander; gecko = экспериментальный.
obfs = salamander
; Пароль обфускации: строка; пусто = сгенерировать и сохранить автоматически.
; Используется при [hysteria2] obfs = salamander / gecko; это не индивидуальный пароль VPN-пользователя.
obfs_password =
; URL сайта-маскировки: http:// или https://, обязателен только при [hysteria2] obfs = none.
masquerade_url = https://example.org
; Закреплённый официальный релиз Hysteria; меняйте только при необходимости.
version = app/v2.13.0
; Размеры при [hysteria2] obfs = gecko в байтах: 1 <= min <= max <= 2048. Для других режимов игнорируются.
min_packet_size = 512
max_packet_size = 1200
